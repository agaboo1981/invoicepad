    <script>

        const variants = {

          }
        };
        const params = new URLSearchParams(window.location.search);
        const fromUrl = params.get('metaVariant');
        const stored = localStorage.getItem('meta_variant');
        const variant = fromUrl === 'b' || stored === 'b' ? 'b' : 'a';
        localStorage.setItem('meta_variant', variant);
        const meta = variants[variant];
        document.title = meta.title;
        const tags = ['meta-description', 'meta-og-title', 'meta-og-description', 'meta-twitter-title', 'meta-twitter-description'];
        const values = [meta.description, meta.title, meta.description, meta.title, meta.description];
        tags.forEach((id, index) => {
          const el = document.getElementById(id);
          if (el) el.setAttribute('content', values[index]);
        });
      })();
    </script>
